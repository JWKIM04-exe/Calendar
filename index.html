<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대체복무 공유 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 조용하고 단정한 문구류 — 책상 위 탁상 달력
   IDEA: 스프링으로 묶인 크림색 종이 한 장이 검정 받침대 위에 서 있는 주간 달력
   PICTURE: 7칸 종이 달력 자체(스프링·큰 세리프 숫자·가는 세로줄·받침대)
   COLOUR and TYPE: 회색 책상, 크림 종이 #f4efe1, 먹색 #1f2723 / Bodoni Moda 숫자 + Noto Serif KR 제목 + Noto Sans KR 본문
   LAYOUT: 위 이름·D-day → 사람 칩·주 이동 → 달력(넓으면 가로 7칸, 좁으면 세로 줄) → 메모 */
:root{color-scheme:light dark;
--desk:light-dark(#e6e7e6,#151817);--ink:light-dark(#1f2723,#ece7da);--sub:light-dark(#6c716d,#a7a99f);
--paper:#f4efe1;--pink:#1f2723;--psub:#7a7a70;--rule:#cfc6b0;--stand:#1d2420;--ring:#2b2b2b;--card:light-dark(#f7f6f2,#1f2421);--acc:#c4511f;--line:light-dark(#d4d3ce,#333a36)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,14px)}
.serif{font-family:"Noto Serif KR",serif}
.banner{background:#fff3cd;color:#5c4400;padding:10px max(4vw,14px);font-size:14px}
.banner.err{background:#fde2e2;color:#7a1010}

/* 머리 */
header{padding:clamp(20px,3vw,36px) 0 8px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{font-family:"Noto Serif KR",serif;font-weight:700;font-size:clamp(26px,3.6vw,38px);line-height:1.1;margin:0;letter-spacing:-.01em}
.grp{font-size:13px;color:var(--sub);margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.me{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:14px;color:var(--sub)}
.big{font-family:"Bodoni Moda",serif;font-weight:600;font-size:34px;line-height:1;color:var(--ink);white-space:nowrap}
.bar{flex:1 1 200px;height:3px;background:var(--line);position:relative}
.bar i{position:absolute;left:0;top:-1px;height:5px;background:var(--ink);width:0}

button{font:inherit;font-size:15px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.pri{background:var(--ink);color:var(--desk)}

/* 사람·주 이동 */
.members{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;font-size:14px;border-color:var(--line)}
.chip.on{border-color:var(--ink);font-weight:700}
.chip small{color:var(--sub);font-family:"Bodoni Moda",serif}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 20px}
.nav h2{font-family:"Noto Serif KR",serif;font-size:20px;margin:0 auto 0 0}
.nav button{min-height:40px;font-size:14px}

/* 달력 */
.cal{position:relative;padding-top:18px;filter:drop-shadow(0 18px 22px rgba(0,0,0,.12))}
.rings{position:absolute;left:0;right:0;top:0;height:34px;display:flex;justify-content:space-around;overflow:hidden;z-index:2;pointer-events:none}
.rings i{flex:none;width:7px;height:30px;border:2.5px solid var(--ring);border-radius:5px;background:linear-gradient(90deg,#555,#111 60%);box-shadow:1px 1px 0 rgba(0,0,0,.2)}
.paper{position:relative;background:var(--paper);color:var(--pink);border-radius:3px 3px 0 0;padding-top:30px;
 background-image:radial-gradient(circle at 50% 12px,var(--desk) 3.5px,transparent 4px);background-size:calc(100%/var(--n,40)) 100%;background-repeat:repeat-x}
.paper::before{content:"";position:absolute;left:0;right:0;top:26px;border-top:1px solid var(--rule)}
.stand{height:26px;background:linear-gradient(var(--stand),#0f1411);border-radius:0 0 4px 4px}
.week{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:calc(100%/7);overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.week::-webkit-scrollbar{display:none}
.day{scroll-snap-align:start}
.edge{display:none;scroll-snap-align:end;border:0;border-radius:0;border-left:1px solid var(--rule);background:#ebe4d1;color:var(--pink);flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:"Noto Serif KR",serif;font-size:15px;min-height:100%}
.edge[data-go="-1"]{scroll-snap-align:start;border-left:0;border-right:1px solid var(--rule)}
.edge span{font-family:"Bodoni Moda",serif;font-size:48px;line-height:1}
.edge small{font-family:"Bodoni Moda",serif;color:var(--psub);font-size:13px}
.edge:hover{background:#e4dcc6}
.day{padding:10px 12px 14px;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:8px;min-height:360px}
.day:first-child{border-left:0}
.dh{display:flex;align-items:baseline;gap:6px;min-height:20px}
.dh .en{font-family:"Bodoni Moda",serif;font-size:13px;letter-spacing:.08em}
.dh .ko{font-size:12px;color:var(--psub)}
.dh .yr,.dh .mo{margin-left:auto;font-family:"Bodoni Moda",serif;font-weight:600;font-size:13px;border:1.5px solid var(--pink);border-radius:50%;padding:0 8px;line-height:1.5}
.dh .mo{font-family:"Noto Serif KR",serif;font-size:12px}
.num{font-family:"Bodoni Moda",serif;font-weight:600;font-size:clamp(44px,5.4vw,72px);line-height:1;margin:2px 0 4px}
.num span{display:inline-block;padding:2px 10px;margin-left:-10px;border-radius:50%;border:2px solid transparent}
.day.today .num span{border-color:var(--pink)}
.stayIn{width:100%;min-height:38px;padding:0 2px;font:inherit;font-size:15px;color:var(--pink);background:transparent;border:0;border-bottom:1px dashed var(--rule);border-radius:0}
.stayIn::placeholder{color:#a29c8a;font-size:13px}
.stays{display:flex;flex-wrap:wrap;gap:4px;font-size:12px}
.stays span{padding:1px 8px;border:1px solid;border-radius:999px;white-space:nowrap;color:var(--pink)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;flex:1}
li{font-size:14px;display:flex;gap:6px;align-items:flex-start;padding:4px 0 6px;border-bottom:1px solid #e3dccb}
li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;background:var(--c,#999)}
li:has(input)::before{display:none}
li input[type=checkbox]{accent-color:var(--c);margin-top:4px}
li .who{font-size:11px;color:var(--psub);display:block}
li .t{font-family:"Bodoni Moda",serif;font-weight:600;white-space:nowrap}
li .x{margin-left:auto;border:0;min-height:24px;padding:0 4px;color:var(--psub);font-size:16px;background:none;border-radius:4px}
li.done .m{text-decoration:line-through;opacity:.55}
li.empty{color:#a29c8a;font-size:13px;border:0}li.empty::before{display:none}
.add{min-height:36px;font-size:13px;border-color:var(--rule);color:var(--pink);background:transparent;border-style:dashed;border-radius:6px}
.add:hover{background:#00000008}

/* 메모 */
.memo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px;margin-top:34px}
.memo label{font-family:"Noto Serif KR",serif;font-weight:700;display:block;margin-bottom:6px}
textarea{width:100%;min-height:110px;padding:12px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;resize:vertical}
.others{margin:16px 0 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.others div{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px;font-size:14px;white-space:pre-wrap}
.others b{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-family:"Noto Serif KR",serif}

/* 달력 버튼 */
.calbtn{width:48px;min-height:48px;padding:0;display:inline-grid;place-items:center;background:var(--ink);color:var(--desk);border-color:var(--ink)}
.calbtn:hover{background:color-mix(in srgb,var(--ink) 85%,transparent)}

/* 한 달 보기 */
dialog.mon{width:min(1120px,96vw);max-height:94vh;overflow:auto;padding:0;border-radius:4px;background:var(--paper)}
.mhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:16px 18px 10px;background:var(--paper);border-bottom:1px solid var(--rule)}
.mhead h3{margin:0 auto 0 4px;order:-1;font-family:"Noto Serif KR",serif;font-size:26px;display:flex;align-items:baseline;gap:10px}
.mhead h3 .y{font-family:"Bodoni Moda",serif;font-weight:600;font-size:14px;border:1.5px solid var(--pink);border-radius:50%;padding:0 8px;line-height:1.5}
.mnav{width:44px;padding:0;font-family:"Bodoni Moda",serif;font-size:24px;line-height:1}
.mx{font-family:inherit;font-size:22px;margin-left:6px}
.mfil{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px 4px}
.mfil .chip{border-color:var(--rule);color:var(--pink);min-height:36px;font-size:13px;padding:0 12px}
.mfil .chip.on{border-color:var(--pink);background:var(--pink);color:var(--paper)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:10px 18px 0}
.mw{font-family:"Bodoni Moda",serif;font-size:12px;letter-spacing:.08em;padding:6px 6px;border-bottom:1px solid var(--pink)}
.mw small{font-family:"Noto Sans KR",sans-serif;color:var(--psub);margin-left:4px;letter-spacing:0}
.mc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:104px;padding:6px;border-bottom:1px solid var(--rule);border-left:1px solid var(--rule);color:var(--pink);overflow:hidden}
.mc:nth-child(7n+8){border-left:0}
.mc:focus-visible{outline:2px solid var(--pink);outline-offset:-2px}
.mc:hover{background:#00000006}
.mc.out{color:#b5ae9b}.mc.out .ml i{opacity:.55}
.mc.sel{background:#e9e1cb}
.mn{font-family:"Bodoni Moda",serif;font-weight:600;font-size:22px;line-height:1}
.mn span{display:inline-block;padding:1px 5px;margin-left:-5px;border:1.5px solid transparent;border-radius:50%}
.mc.today .mn span{border-color:var(--pink)}
.ml{display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1.35}
.ml i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px;border-left:3px solid var(--c)}
.ml i.st{border:1px solid var(--c);border-radius:999px;padding:0 6px;align-self:flex-start;max-width:100%}
.ml b{font-family:"Bodoni Moda",serif}
.ml em{font-style:normal;font-size:11px;color:var(--psub)}
.mdots{display:none;gap:3px;flex-wrap:wrap}.mdots s{width:6px;height:6px;border-radius:50%}
.mday{padding:14px 18px 20px;border-top:1px solid var(--pink);margin-top:-1px}
.mdh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mdh b{font-family:"Noto Serif KR",serif;font-size:18px}
.mdh button{min-height:38px;font-size:13px}
.mday ul{gap:4px}.mhint{margin:0;color:var(--psub);font-size:14px}
@media(max-width:700px){
 .mgrid,.mfil,.mhead,.mday{padding-left:10px;padding-right:10px}
 .mc{min-height:62px;padding:5px 3px;align-items:center}
 .mn{font-size:18px}.mn span{margin-left:0}
 .ml{display:none}.mdots{display:flex;justify-content:center}
 .mw{text-align:center;padding:6px 0;font-size:10px}.mw small{display:block;margin:0}
 .mhead h3{font-size:22px}
}

/* 대화상자 */
dialog{border:0;border-radius:4px;background:var(--paper);color:var(--pink);width:min(440px,92vw);padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:#0007}
dialog h3{margin:0 0 14px;font-family:"Noto Serif KR",serif;font-size:21px}
dialog button{border-color:var(--pink);color:var(--pink)}dialog button.pri{background:var(--pink);color:var(--paper)}
.f{display:grid;gap:10px}.f label{font-size:13px;color:var(--psub)}
.f input,.f select{width:100%;min-height:44px;padding:0 10px;font:inherit;font-size:16px;color:var(--pink);background:#fffdf6;border:1px solid var(--rule);border-radius:4px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.sw{position:relative;width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--paper);background:var(--s);box-shadow:0 0 0 1px var(--rule);cursor:pointer;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--pink)}
.sw.on::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--paper);opacity:.9}
.sw.auto{width:auto;padding:0 12px;border-radius:999px;background:transparent;font-size:13px;color:var(--pink);display:inline-flex;align-items:center;gap:6px}
.sw.auto::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--s)}
.sw.auto.on::after{display:none}
.sw.pick{background:conic-gradient(#e8572a,#d6a21f,#1f9d6b,#2aa6b8,#2f6fdf,#9b4fd6,#d23c7a,#e8572a);overflow:hidden}
.sw.pick.on{background:var(--s)}
.sw.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.cnow{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-left:4px}
.ed{all:unset;cursor:pointer;flex:1;min-width:0;border-radius:4px}
.ed:hover{background:#00000008}.ed:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.quick{margin:0 0 22px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.ql{display:block;font-family:"Noto Serif KR",serif;font-weight:700;margin-bottom:6px}
.qrow{display:flex;gap:8px;align-items:flex-start}
.qrow textarea{flex:1;min-height:46px;height:46px;padding:11px 12px;resize:none;line-height:1.45;overflow:hidden}
.qrow button{flex:none;min-height:46px}
.qrow button:disabled{opacity:.45;cursor:default}
.qprev{display:flex;flex-direction:column;gap:6px;margin-top:10px}.qprev:empty{display:none}
.qi{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 10px;border-radius:6px;background:var(--desk);border-left:4px solid var(--c)}
.qi .qd{font-family:"Bodoni Moda",serif;font-weight:600;white-space:nowrap}
.qi .qt{font-family:"Bodoni Moda",serif;white-space:nowrap;color:var(--sub)}
.qi .qx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .qg{font-size:12px;color:var(--sub);white-space:nowrap}
.qi.bad{border-left-color:#c03030;color:#c03030}
.qhelp{margin:8px 0 0;font-size:12.5px;color:var(--sub)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0;opacity:0}
.fhint{margin:0;font-size:13px;color:var(--psub)}.fhint:empty,.ferr:empty{display:none}
.ferr{margin:0;font-size:14px;color:#a02020;font-weight:500}
.row .lo{margin-right:auto}
textarea:disabled{opacity:.6}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--stand);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}

@media(max-width:600px){.nav h2{flex-basis:100%}.acts button{min-height:40px;font-size:14px}}
/* 좁은 화면: 가로 그대로, 옆으로 밀어서 넘기기 (2칸 + 다음 칸 살짝) */
@media(max-width:900px){
 .week{grid-auto-columns:calc(100%/3.2)}
 .edge{display:flex}
 .day{min-height:340px}
}
@media(max-width:600px){
 .week{grid-auto-columns:calc(100%/2.15)}
 .num{font-size:52px}
 .day{padding:10px 10px 14px}
}
.hint{display:none;text-align:center;font-size:12px;color:var(--sub);margin-top:10px}
@media(max-width:900px){.hint{display:block}}
</style>
</head>
<body>
<div id="banner" class="banner" hidden></div>
<header><div class="wrap">
  <div class="top">
    <div><h1>대체복무 공유 캘린더</h1><div class="grp" id="grp"></div></div>
    <div class="acts"><button id="invite">초대 링크 복사</button><button id="editMe">내 정보</button>
      <button id="monthBtn" class="calbtn" aria-label="한 달 전체 일정 보기" title="한 달 보기"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="4" y="7" width="24" height="21" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 13h24" stroke="currentColor" stroke-width="2"/><path d="M10 4v6M22 4v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><g fill="currentColor"><rect x="8" y="16" width="3.2" height="3.2" rx=".6"/><rect x="14.4" y="16" width="3.2" height="3.2" rx=".6"/><rect x="20.8" y="16" width="3.2" height="3.2" rx=".6"/><rect x="8" y="21.6" width="3.2" height="3.2" rx=".6"/><rect x="14.4" y="21.6" width="3.2" height="3.2" rx=".6"/></g></svg></button></div>
  </div>
  <div class="me"><span class="big" id="dday">D-?</span><div class="bar"><i id="pbar"></i></div><span id="ptxt">불러오는 중…</span></div>
</div></header>

<main><div class="wrap">
  <div class="members" id="members"></div>
  <div class="nav">
    <h2 id="wk">주간</h2>
    <button id="prev" aria-label="이전 주">‹ 이전 주</button>
    <button id="now">이번 주</button>
    <button id="next" aria-label="다음 주">다음 주 ›</button>
  </div>
  <form class="quick" id="quick" autocomplete="off" hidden>
    <label for="qIn" class="ql">빠른 추가</label>
    <div class="qrow">
      <textarea id="qIn" rows="1" placeholder="12일 오전9시 다이소가기, 15일 오후7시 오징어먹기 빨강" enterkeyhint="done"></textarea>
      <button class="pri" id="qOk" type="submit" disabled>추가</button>
    </div>
    <div class="qprev" id="qPrev" aria-live="polite"></div>
    <p class="qhelp">날짜 · 시간 · 내용 · (색) 순서로 적고, 여러 개는 쉼표나 줄바꿈으로 나눠요. 날짜를 빼면 오늘, 색을 빼면 기본색이에요.</p>
  </form>
  <div class="cal">
    <div class="rings" id="rings" aria-hidden="true"></div>
    <div class="paper" id="paper"><div class="week" id="week"></div></div>
    <div class="stand" aria-hidden="true"></div>
  </div>
  <p class="hint">옆으로 밀면 날짜가 계속 이어져요</p>
  <div class="memo">
    <div><label for="goal">내 이번 주 목표</label><textarea id="goal" placeholder="예: 자격증 공부 하루 1시간"></textarea></div>
    <div><label for="memo">내 메모 / 회고</label><textarea id="memo" placeholder="이번 주에 있었던 일, 다음 주에 챙길 것"></textarea></div>
  </div>
  <div class="others" id="others"></div>
</div></main>

<dialog id="joinDlg"><form id="joinFrm" novalidate>
  <h3 id="joinT">로그인</h3>
  <div class="f">
    <div id="whoWrap"><label for="pick">누구세요?</label><select id="pick"></select></div>
    <div id="newWrap" class="f">
      <div><label for="jName">이름</label><input id="jName" maxlength="30" autocomplete="name"></div>
      <div><label for="jOrg">복무기관</label><input id="jOrg" maxlength="60" placeholder="○○교도소"></div>
      <div><label for="jRoom">생활관 / 숙소</label><input id="jRoom" maxlength="60" placeholder="2생활관 3호실"></div>
      <div><label for="jSt">복무 시작일</label><input id="jSt" type="date"></div>
      <div><label for="jEn">복무 종료일 (비우면 36개월 자동)</label><input id="jEn" type="date"></div>
    </div>
    <input id="jUser" class="sr" name="username" autocomplete="username" tabindex="-1" aria-hidden="true">
    <div><label for="jPw" id="jPwL">비밀번호</label><input id="jPw" name="password" type="password" maxlength="64"></div>
    <div id="pw2Wrap"><label for="jPw2">비밀번호 확인</label><input id="jPw2" type="password" maxlength="64" autocomplete="new-password"></div>
    <p class="fhint" id="jHint"></p>
    <p class="ferr" id="jErr" role="alert"></p>
  </div>
  <div class="row"><button type="button" id="logout" class="lo" hidden>로그아웃</button><button type="button" id="joinCancel">닫기</button><button class="pri" type="submit" id="joinOk">로그인</button></div>
</form></dialog>

<dialog id="evDlg"><form id="evFrm">
  <h3 id="evT">일정 추가</h3>
  <div class="f">
    <div><label for="fTime">시간 (선택)</label><input id="fTime" type="time"></div>
    <div><label for="fText">내용</label><input id="fText" required></div>
    <div><label for="fKind">분류</label><select id="fKind">
      <option value="근무">근무</option><option value="교육·훈련">교육·훈련</option><option value="개인">개인 일정</option><option value="외출·외박">외출·외박·휴가</option><option value="공지">공지 (전체)</option>
    </select></div>
    <div><label>색 <span class="cnow" id="fColorNow"></span></label><div class="swatches" id="fColors"></div></div>
  </div>
  <div class="row"><button type="button" id="evCancel">취소</button><button class="pri" type="submit" id="evOk">저장</button></div>
</form></dialog>

<dialog id="monDlg" class="mon" aria-label="한 달 일정">
  <div class="mhead">
    <button id="mPrev" class="mnav" aria-label="이전 달">‹</button>
    <h3 id="mTitle">월</h3>
    <button id="mNext" class="mnav" aria-label="다음 달">›</button>
    <button id="mClose" class="mnav mx" aria-label="닫기">×</button>
  </div>
  <div class="mfil" id="mFil"></div>
  <div class="mgrid" id="mGrid"></div>
  <div class="mday" id="mDay"></div>
</dialog>

<div class="toast" id="toast"></div>
<script type="module" src="app.js?v=2611230737"></script>
</body>
</html>
